[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-enterprise-decision-eval-lab"
version = "0.1.0"
description = "Evaluate Jev as a fast enterprise decision plane against frontier LLMs and confidence-gated cascades."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
decision-lab = "decision_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

